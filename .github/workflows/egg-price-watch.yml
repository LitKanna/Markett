name: Egg price watch (reactive)

# Retailers do not offer price-change webhooks. This job polls sources and
# POSTs a snapshot to getyolko.com so the Worker can diff + emit events.
on:
  schedule:
    # Every 15 minutes (GitHub cron can drift a few minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scout + push snapshot
        env:
          YOLKO_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PRICE_WATCH_API: ${{ vars.PRICE_WATCH_API }}
        run: |
          set -euo pipefail
          if [ -z "${YOLKO_ADMIN_KEY:-}" ]; then
            echo "Missing ADMIN_KEY secret — cannot ingest"
            exit 1
          fi
          API="${PRICE_WATCH_API:-https://getyolko.com}"
          python3 infra/egg-price-scout.py --no-manual --json /tmp/egg-prices.json --push "$API"
